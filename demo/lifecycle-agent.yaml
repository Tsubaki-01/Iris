name: iris-lifecycle-smoke

model:
  provider: deepseek
  name: deepseek-chat
  temperature: 0
  max_tokens: 512
  timeout: 90

system: |
  You are an Iris lifecycle smoke agent. Follow explicit requests to call
  ask_question or wait_for_seconds exactly as written. After a tool result or
  human answer, report the outcome briefly and do not call another tool.

tools:
  builtin:
    - human.ask
  python:
    functions:
      - demo.lifecycle_tools:wait_for_seconds

permissions:
  workspace: workspace
  writes: allow

session:
  backend: sqlite
  path: .iris/lifecycle-smoke.db
