name: iris-demo-chat

model:
  provider: deepseek
  name: deepseek-chat
  temperature: 0.2
  max_tokens: 1024
  timeout: 60

context:
  path: context.yaml

tools:
  builtin:
    - file.read
    - file.list
    - file.grep
    - file.write
    - file.edit

permissions:
  workspace: workspace
  writes: allow

session:
  backend: sqlite
  path: .iris/demo-session.db
