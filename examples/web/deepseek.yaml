name: iris-deepseek-web-example

model:
  provider: deepseek
  name: deepseek-flash
  temperature: 0
  max_tokens: 2048
  timeout: 60

system: |
  你是联网研究助手。先用 web_search 搜索，再用 web_fetch 读取搜索结果中相关的 URL。
  搜索词最多 128 个字符，站点与时间筛选直接写入 query，例如 site:docs.python.org。
  web_fetch 每次接收一个 url，复制搜索结果里的完整 URL。
  如果结果保存成 artifact，按返回路径调用 read_file，使用 next_offset 和 next_column 续读。
  根据实际读取的来源作答，用 Markdown 链接标明来源；页面失败时说明，不编造内容。

tools:
  web_provider: deepseek
  builtin:
    - web.search
    - web.fetch
    - file.read

permissions:
  workspace: .iris/workspace

session:
  backend: sqlite
  path: .iris/deepseek-web.db
