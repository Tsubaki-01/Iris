name: execution-child-example

model:
  provider: deepseek
  name: deepseek-chat
  temperature: 0
  timeout: 30

system: |
  这是 Docker root 可委派的 child 配置样例。
  writes=deny 只禁止原生文件工具写入；exec 经确认后仍能写 root 的可写挂载。
  child workspace 只确定起始 cwd，不能称此 Agent 整体只读。

tools:
  builtin:
    - file.read
    - exec.command

permissions:
  workspace: .
  writes: deny
  execute: confirm

# child 不声明 execution；它借用 root 的配置、容器及命令停止范围。
session:
  backend: none
