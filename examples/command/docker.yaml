name: command-docker-example

model:
  provider: deepseek
  name: deepseek-chat
  temperature: 0
  timeout: 30

system: |
  所有 session 和 child 共享这个 root 的 Linux 容器及 /workspace。
  正常完成和等待交互保留环境。run 异常会先停止共享环境，再提交终态。
  后续命令重启环境且文件保留，但后台服务必须显式重启。

tools:
  builtin:
    - file.write
    - file.read
    - human.ask
    - exec.command

permissions:
  workspace: workspace
  writes: allow
  execute: confirm

command:
  mode: docker
  timeout_seconds: 15
  docker:
    image: iris-command:local
    network: none
    cpus: 1
    memory_mb: 256
    pids_limit: 64
    environment:
      PYTHONDONTWRITEBYTECODE: "1"

session:
  backend: none
