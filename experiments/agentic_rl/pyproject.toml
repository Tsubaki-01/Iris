[project]
name = "iris-agent-evaluation"
version = "0.1.0"
description = "Repository-level Iris evaluation adapters"
requires-python = ">=3.12"
dependencies = [
    "harbor==0.24.0",
]

[build-system]
requires = ["uv_build>=0.11.32,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "evaluation"
module-root = ""

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.1",
]
